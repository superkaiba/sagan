<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a2147"/>
      <stop offset="60%" stop-color="#0a0e24"/>
      <stop offset="100%" stop-color="#020410"/>
    </radialGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#bce5ff"/>
      <stop offset="35%" stop-color="#5b9eff"/>
      <stop offset="70%" stop-color="#5b9eff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5b9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a4878" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3a4878" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a4878" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- orbital rings (suggesting Voyager / planetary motion) -->
  <g opacity="0.85">
    <ellipse cx="256" cy="256" rx="210" ry="58" fill="none" stroke="url(#ring)" stroke-width="2.4" transform="rotate(-26 256 256)"/>
    <ellipse cx="256" cy="256" rx="170" ry="42" fill="none" stroke="url(#ring)" stroke-width="1.8" transform="rotate(18 256 256)"/>
    <ellipse cx="256" cy="256" rx="120" ry="28" fill="none" stroke="url(#ring)" stroke-width="1.2" transform="rotate(-8 256 256)"/>
  </g>

  <!-- pale blue dot -->
  <circle cx="256" cy="256" r="96" fill="url(#dot)"/>
  <circle cx="256" cy="256" r="22" fill="#dff1ff"/>

  <!-- field stars -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="92"  cy="118" r="2.4"/>
    <circle cx="146" cy="64"  r="1.4"/>
    <circle cx="412" cy="98"  r="2.2"/>
    <circle cx="448" cy="172" r="1.4"/>
    <circle cx="378" cy="396" r="2.0"/>
    <circle cx="436" cy="334" r="1.3"/>
    <circle cx="120" cy="404" r="2.0"/>
    <circle cx="62"  cy="318" r="1.5"/>
    <circle cx="216" cy="436" r="1.4"/>
    <circle cx="320" cy="78"  r="1.2"/>
  </g>
</svg>
